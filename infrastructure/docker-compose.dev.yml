services:

  # ── Infrastructure port overrides (dev only) ────────────────────────────────
  # Extends base services to expose ports on the host for local tooling
  # (IDE DB connections, RabbitMQ management UI, MinIO console).

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  # ── Application services (development) ─────────────────────────────────────

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5062
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=auth_db;Username=auth_service;Password=${AUTH_SERVICE_DB_PASSWORD:-auth_service_password}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:-localdevpassword}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ssz_admin
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-localdevpassword}
      Auth__Issuer: https://auth.ssz-platform.internal
      Auth__Audience: ssz-services
      Auth__PrivateKeyPath: /app/keys/jwt_private_key.pem
      Auth__PublicKeyPath: /app/keys/jwt_public_key.pem
      Auth__MfaChallengeSecret: ${MFA_CHALLENGE_SECRET:-dev-mfa-secret}
      Auth__EncryptionKey: ${TOTP_ENCRYPTION_KEY:-dev-totp-key-32-chars-minimum!!}
      Auth__TotpIssuer: SSZPlatform
      Auth__AppBaseUrl: ${APP_BASE_URL:-http://localhost:3000}
    volumes:
      - ../services/auth-service/keys:/app/keys:ro
    ports:
      - "5062:5062"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5062/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-profile-service:
    build:
      context: ../
      dockerfile: services/user-profile-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://profile_service:${PROFILE_SERVICE_DB_PASSWORD:-localdevpassword}@postgres:5432/profiles_db
      RABBITMQ_URL: amqp://ssz_admin:${RABBITMQ_PASSWORD:-localdevpassword}@rabbitmq:5672
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  organization-service:
    build:
      context: ../
      dockerfile: services/organization-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://org_service:${ORG_SERVICE_DB_PASSWORD:-localdevpassword}@postgres:5432/organizations_db
      RABBITMQ_URL: amqp://ssz_admin:${RABBITMQ_PASSWORD:-localdevpassword}@rabbitmq:5672
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      INVITATION_JWT_SECRET: ${INVITATION_JWT_SECRET:-dev-invitation-secret-32-chars!!}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      PROFILE_SERVICE_URL: http://user-profile-service:3001
      SCHEDULING_SERVICE_URL: http://scheduling-service:3009
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  content-service:
    build:
      context: ../
      dockerfile: services/content-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://content_service:${CONTENT_SERVICE_DB_PASSWORD:-localdevpassword}@postgres:5432/content_db
      RABBITMQ_URL: amqp://ssz_admin:${RABBITMQ_PASSWORD:-localdevpassword}@rabbitmq:5672
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      ORGANIZATION_SERVICE_URL: http://organization-service:3002
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-internal-dev-token}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdevpassword}
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3003/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  piper-tts:
    build:
      context: ./piper
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/voices || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  media-service:
    build:
      context: ../
      dockerfile: services/media-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: postgresql://media_service:${MEDIA_SERVICE_DB_PASSWORD:-localdevpassword}@postgres:5432/media_db
      RABBITMQ_URL: amqp://ssz_admin:${RABBITMQ_PASSWORD:-localdevpassword}@rabbitmq:5672
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_PUBLIC: ssz-public
      MINIO_BUCKET_PRIVATE: ssz-private
      PIPER_URL: http://piper-tts:5000
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdevpassword}
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3004/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  notification-service:
    build:
      context: ../
      dockerfile: services/notification-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3005
      DATABASE_URL: postgresql://notifications_service:${NOTIFICATIONS_SERVICE_DB_PASSWORD:-localdevpassword}@postgres:5432/notifications_db
      RABBITMQ_URL: amqp://ssz_admin:${RABBITMQ_PASSWORD:-localdevpassword}@rabbitmq:5672
      RABBITMQ_EXCHANGE: notification.events
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdevpassword}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM_NAME: SSZ Platform
      EMAIL_FROM_ADDRESS: noreply@ssz.local
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3005/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  exercise-engine-service:
    build:
      context: ../
      dockerfile: services/exercise-engine-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3006
      DATABASE_URL: postgresql://exercise_engine_service:${EXERCISE_ENGINE_SERVICE_DB_PASSWORD:-localdevpassword}@postgres:5432/exercises_db
      RABBITMQ_URL: amqp://ssz_admin:${RABBITMQ_PASSWORD:-localdevpassword}@rabbitmq:5672
      RABBITMQ_EXCHANGE: exercise-engine.events
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdevpassword}
      REDIS_DB: 5
      REDIS_KEY_PREFIX: "exercise-engine:"
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      CONTENT_SERVICE_BASE_URL: http://content-service:3003
      ORGANIZATION_SERVICE_BASE_URL: http://organization-service:3002
      LEARNING_SERVICE_BASE_URL: http://learning-service:3007
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-internal-dev-token}
      EXERCISE_DEFINITION_CACHE_TTL_SECONDS: 300
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3006/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  learning-service:
    build:
      context: ../
      dockerfile: services/learning-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3007
      DATABASE_URL: postgresql://learning_service:${LEARNING_SERVICE_DB_PASSWORD:-localdevpassword}@postgres:5432/learning_db
      RABBITMQ_URL: amqp://ssz_admin:${RABBITMQ_PASSWORD:-localdevpassword}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdevpassword}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      CONTENT_SERVICE_URL: http://content-service:3003
      ORGANIZATION_SERVICE_URL: http://organization-service:3002
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-internal-dev-token}
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3007/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  analytics-service:
    build:
      context: ../
      dockerfile: services/analytics-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3008
      DATABASE_URL: postgresql://analytics_service:${ANALYTICS_SERVICE_DB_PASSWORD:-localdevpassword}@postgres:5432/analytics_db
      RABBITMQ_URL: amqp://ssz_admin:${RABBITMQ_PASSWORD:-localdevpassword}@rabbitmq:5672
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      ORGANIZATION_SERVICE_URL: http://organization-service:3002
      LEARNING_SERVICE_URL: http://learning-service:3005
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-internal-dev-token}
      AT_RISK_THRESHOLD_DAYS: 7
      DROPOFF_COMPLETION_THRESHOLD: 0.3
    ports:
      - "3008:3008"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3008/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduling-service:
    build:
      context: ../
      dockerfile: services/scheduling-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3009
      DATABASE_URL: postgresql://scheduling_service:${SCHEDULING_SERVICE_DB_PASSWORD:-localdevpassword}@postgres:5432/scheduling_db
      RABBITMQ_URL: amqp://ssz_admin:${RABBITMQ_PASSWORD:-localdevpassword}@rabbitmq:5672
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      ORGANIZATION_SERVICE_URL: http://organization-service:3002
      PROFILE_SERVICE_URL: http://user-profile-service:3001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-internal-dev-token}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdevpassword}
    ports:
      - "3009:3009"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3009/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Gateway ─────────────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-profile-service
      - organization-service
      - content-service
      - media-service
      - notification-service
      - learning-service
      - exercise-engine-service
      - analytics-service
      - scheduling-service

  # ── Dev-only tools ──────────────────────────────────────────────────────────

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ssz.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
