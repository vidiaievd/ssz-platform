services:

  # ── Infrastructure port overrides (dev only) ────────────────────────────────
  # Extends base services to expose ports on the host for local tooling
  # (IDE DB connections, RabbitMQ management UI, MinIO console).

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  # ── Application services (development) ─────────────────────────────────────
  
  learning-service:
    build:
      context: ../
      dockerfile: services/learning-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3007
      DATABASE_URL: postgresql://learning_service:${LEARNING_SERVICE_DB_PASSWORD:-localdevpassword}@postgres:5432/learning_db
      RABBITMQ_URL: amqp://ssz_admin:${RABBITMQ_PASSWORD:-localdevpassword}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdevpassword}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      CONTENT_SERVICE_URL: http://content-service:3003
      ORGANIZATION_SERVICE_URL: http://organization-service:3002
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-internal-dev-token}
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3007/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Gateway ─────────────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - learning-service

  # ── Dev-only tools ──────────────────────────────────────────────────────────

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ssz.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
