worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Docker's embedded DNS — resolves service names at request time, not at startup.
    # This allows nginx to start even when some app containers are not yet running.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;

    server {
        listen 80;
        server_name _;

        # ── Proxy headers ─────────────────────────────────────────────────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID  $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # ── CORS for local frontend (localhost:3000) ───────────────────────────
        # If NestJS services also call app.enableCors(), disable it there to
        # avoid duplicate headers reaching the browser.
        add_header Access-Control-Allow-Origin      "http://localhost:3000" always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Correlation-ID" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age           "86400" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── Auth Service  :5062 ───────────────────────────────────────────────
        # Swagger: http://localhost:5062/swagger (direct, Swashbuckle doesn't proxy well)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            set $svc http://auth-service:5062;
            proxy_pass $svc;
        }

        # ── User Profile Service  :3001 ───────────────────────────────────────
        # Swagger: http://localhost:3001/api/docs
        location /api/v1/profiles/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://user-profile-service:3001;
            proxy_pass $svc;
        }

        # ── Organization Service  :3002 ───────────────────────────────────────
        # Swagger: http://localhost:3002/api/docs
        # Controllers: @Controller('schools'), @Controller('tutoring'),
        #              @Controller('internal/schools')
        location /api/v1/schools/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://organization-service:3002;
            proxy_pass $svc;
        }

        location /api/v1/tutoring/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://organization-service:3002;
            proxy_pass $svc;
        }

        location /api/v1/internal/schools/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://organization-service:3002;
            proxy_pass $svc;
        }

        # ── Exercise Engine Service  :3006 ────────────────────────────────────
        # Swagger: http://localhost:3006/api/docs
        # Must be declared BEFORE the /api/v1/exercises/ prefix block so that
        # nginx's regex takes priority over the prefix match for attempt routes.
        location ~ ^/api/v1/exercises/[^/]+/attempts {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://exercise-engine-service:3006;
            proxy_pass $svc;
        }

        # ── Content Service  :3003 ────────────────────────────────────────────
        # Swagger: http://localhost:3003/api/docs
        # Controllers: containers, exercises (CRUD), grammar-rules, lessons,
        #              vocabulary-lists, exercise-templates, tags (including
        #              /:entityType/:entityId/tags), content-shares (including
        #              /:entityType/:entityId/shares), entitlements (me/, content-entitlements/)
        #
        # Note: /api/v1/exercises/ (prefix) loses to the regex above for /attempts
        # paths, so exercise CRUD routes reach content-service correctly.
        # Entity-scoped tag/share routes (e.g. /api/v1/containers/:id/tags) are
        # covered by the /api/v1/containers/ prefix block below.
        location /api/v1/containers/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://content-service:3003;
            proxy_pass $svc;
        }

        location /api/v1/exercises/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://content-service:3003;
            proxy_pass $svc;
        }

        location /api/v1/grammar-rules/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://content-service:3003;
            proxy_pass $svc;
        }

        location /api/v1/lessons/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://content-service:3003;
            proxy_pass $svc;
        }

        location /api/v1/vocabulary-lists/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://content-service:3003;
            proxy_pass $svc;
        }

        location /api/v1/exercise-templates/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://content-service:3003;
            proxy_pass $svc;
        }

        location /api/v1/tags/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://content-service:3003;
            proxy_pass $svc;
        }

        location /api/v1/content-shares/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://content-service:3003;
            proxy_pass $svc;
        }

        location /api/v1/content-entitlements/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://content-service:3003;
            proxy_pass $svc;
        }

        # /api/v1/me/entitlements and /api/v1/me/shared-with-me (content-service)
        location /api/v1/me/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://content-service:3003;
            proxy_pass $svc;
        }

        # ── Media Service  :3004 ─────────────────────────────────────────────
        # Swagger: http://localhost:3004/api/docs
        location /api/v1/media/ {
            limit_req zone=api_limit burst=20 nodelay;
            client_max_body_size 512m;
            set $svc http://media-service:3004;
            proxy_pass $svc;
        }

        # ── Notification Service  :3005 ───────────────────────────────────────
        # Swagger: http://localhost:3005/api/docs
        location /api/v1/notifications/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://notification-service:3005;
            proxy_pass $svc;
        }

        # ── Learning Service  :3007 ───────────────────────────────────────────
        # Swagger: http://localhost:3007/api/docs
        # Controllers: assignments, enrollments, progress, review/submissions, srs
        location /api/v1/assignments/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://learning-service:3007;
            proxy_pass $svc;
        }

        location /api/v1/enrollments/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://learning-service:3007;
            proxy_pass $svc;
        }

        location /api/v1/progress/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://learning-service:3007;
            proxy_pass $svc;
        }

        # ReviewController uses @Controller('review/submissions')
        location /api/v1/review/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://learning-service:3007;
            proxy_pass $svc;
        }

        # SRS controller uses @Controller('srs')
        location /api/v1/srs/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $svc http://learning-service:3007;
            proxy_pass $svc;
        }

        # ── Health ────────────────────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
