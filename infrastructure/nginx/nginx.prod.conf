worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml
                      application/xml+rss text/javascript;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    # auth-service listens on :5000 in prod (ASPNETCORE_URLS: http://+:5000)
    upstream auth_service         { server auth-service:5000; }
    upstream profile_service      { server user-profile-service:3001; }
    upstream org_service          { server organization-service:3002; }
    upstream content_service      { server content-service:3003; }
    upstream media_service        { server media-service:3004; }
    upstream notification_service { server notification-service:3005; }
    upstream exercise_service     { server exercise-engine-service:3006; }
    upstream learning_service     { server learning-service:3007; }
    upstream analytics_service    { server analytics-service:3008; }
    upstream scheduling_service   { server scheduling-service:3009; }

    # ── Rate limiting (stricter than dev) ─────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=20r/s;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;  # Replace with your domain, e.g.: api.ssz-platform.com

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Security headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ── Proxy headers ─────────────────────────────────────────────────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID  $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # ── Auth Service  :5000 ───────────────────────────────────────────────
        location /api/v1/auth {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_service;
        }

        # ── User Profile Service  :3001 ───────────────────────────────────────
        location /api/v1/profiles {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://profile_service;
        }

        # ── Organization Service  :3002 ───────────────────────────────────────
        location /api/v1/organizations {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://org_service;
        }

        # ── Content Service  :3003 ────────────────────────────────────────────
        location /api/v1/content {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://content_service;
        }

        # ── Media Service  :3004 ─────────────────────────────────────────────
        location /api/v1/media {
            limit_req zone=api_limit burst=10 nodelay;
            client_max_body_size 512m;
            proxy_pass http://media_service;
        }

        # ── Notification Service  :3005 ───────────────────────────────────────
        location /api/v1/notifications {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://notification_service;
        }

        # ── Exercise Engine Service  :3006 ────────────────────────────────────
        location ~ ^/api/v1/exercises/[^/]+/attempts {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://exercise_service;
        }

        # ── Learning Service  :3007 ───────────────────────────────────────────
        location /api/v1/assignments {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://learning_service;
        }

        location /api/v1/enrollments {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://learning_service;
        }

        location /api/v1/progress {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://learning_service;
        }

        location /api/v1/submissions {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://learning_service;
        }

        # ── Analytics Service  :3008 ─────────────────────────────────────────
        location /api/v1/analytics {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://analytics_service;
        }

        location /api/v1/internal/events {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://analytics_service;
        }

        # ── Scheduling Service  :3009 ─────────────────────────────────────────
        location /api/v1/scheduling {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://scheduling_service;
        }

        # ── Health ────────────────────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
